[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"


[project]
name = "CustomTranspilation"
version = "0.0.1"
authors = [
  { name="Barnaby Marshall", email="" },
]
description = "A quantum circuit transpilation pipeline aiming to optimise quantum circuits under the simulated conditions of superconducting qubit-based quantum hardware."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "qiskit"
    "qiskit-aer"
    "numpy"
    "matplotlib"
    "pylatexenc"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/BJT-Marshall/CustomTranspiler"
Issues = "https://github.com/BJT-Marshall/CustomTranspiler/Issues"